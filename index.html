<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CreatRilL Website</title>
    <link rel="icon" href="siteicon.png" type="image/x-icon">
    <!-- Подключение иконок FontAwesome для соцсетей -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <style>
        /* Подключение стороннего шрифта Etude Noire */
        @font-face {
            font-family: 'Etude Noire';
            src: url('EtudeNoire.woff2') format('woff2'),
                 url('EtudeNoire.ttf') format('truetype');
            font-weight: normal;
            font-style: normal;
            font-display: swap;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            /* Базовый тёмно-синий фон */
            background-color: #0d1b2a;
            font-family: 'Etude Noire', 'Segoe UI', Tahoma, sans-serif; 
            color: white;
            
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            overflow: hidden;
            position: relative;
        }

        .animated-bg-image {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            z-index: -2;
            
            background-image: url('background.png'); 
            
            background-size: 40%;
            background-position: center;
            background-repeat: no-repeat;

            /* Плавная бесконечная анимация мигания (10 секунд на один цикл) */
            animation: slowPulseImage 5s ease-in-out infinite alternate;
        }

        /* Анимация медленного мигания картинки (прозрачность + яркость) */
        @keyframes slowPulseImage {
            0% {
                opacity: 0.15;
                filter: brightness(0.6);
                transform: scale(0.7);
            }
            50% {
                opacity: 0.55;
                filter: brightness(1.1);
                transform: scale(0.9);
            }
            100% {
                opacity: 0.15;
                filter: brightness(0.6);
                transform: scale(0.8);
            }
        }

        /* Дополнительный атмосферный анимированный градиент на фоне */
        .animated-bg-gradient {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            z-index: -1;
            pointer-events: none;
            background: 
                radial-gradient(circle at 20% 20%, rgba(41, 117, 199, 0.25) 0%, transparent 50%),
                radial-gradient(circle at 80% 80%, rgba(119, 179, 248, 0.15) 0%, transparent 60%),
                radial-gradient(circle at 50% 50%, rgba(10, 30, 60, 0.4) 0%, transparent 70%);
            
            animation: slowPulseGlow 4s ease-in-out infinite alternate;
        }

        @keyframes slowPulseGlow {
            0% {
                opacity: 0.2;
                transform: scale(1);
            }
            100% {
                opacity: 0.9;
                transform: scale(1.3);
            }
        }

        /* ========================================================================= */
        /* 2. ЗАГОЛОВОК С АНИМАЦИЕЙ ПОЯВЛЕНИЯ СВЕРХУ                                 */
        /* ========================================================================= */
        h1 {
            font-size: 3rem;
            margin-bottom: 40px;
            letter-spacing: 2px;
            font-weight: 600;
            text-shadow: 0 4px 15px rgba(0, 0, 0, 0.7);
            text-align: center;

            /* Подключение анимации появления сверху */
            animation: slideInDown 2.5s cubic-bezier(0.16, 1, 0.3, 1) forwards;
        }

        /* Ключевые кадры появления заголовка */
        @keyframes slideInDown {
            0% {
                opacity: 0;
                transform: translateY(-60px);
            }
            100% {
                opacity: 1;
                transform: translateY(0);
            }
        }

        /* ========================================================================= */
        /* 3. СТЕКЛЯННОЕ ОКНО С АНИМАЦИЕЙ ПОЯВЛЕНИЯ СНИЗУ                             */
        /* ========================================================================= */
        .glass-square {
            width: 350px;
            height: 450px;
            background: rgba(10, 25, 45, 0.35);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid rgba(119, 179, 248, 0.2);
            border-radius: 20px;
            box-shadow: 0 15px 35px rgba(0, 0, 0, 0.4);
            
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 25px;

            /* Подключение анимации появления снизу */
            animation: slideInUp 1.2s cubic-bezier(0.16, 1, 0.3, 1) forwards;
        }

        /* Ключевые кадры появления окна */
        @keyframes slideInUp {
            0% {
                opacity: 0;
                transform: translateY(60px);
            }
            100% {
                opacity: 1;
                transform: translateY(0);
            }
        }

        /* Кнопки главного меню */
        .glass-btn {
            width: 75%;
            padding: 16px;
            font-size: 1.1rem;
            font-family: inherit;
            color: white;
            text-transform: uppercase;
            letter-spacing: 1px;
            background: rgba(119, 179, 248, 0.1);
            border: 1px solid rgba(119, 179, 248, 0.25);
            border-radius: 12px;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .glass-btn:hover {
            background: rgba(119, 179, 248, 0.3);
            border-color: rgba(119, 179, 248, 0.5);
            box-shadow: 0 5px 20px rgba(0, 0, 0, 0.4);
            transform: translateY(-2px);
        }

        /* Оверлей всплывающего окна */
        .modal-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.7);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            
            display: flex;
            align-items: center;
            justify-content: center;
            
            opacity: 0;
            visibility: hidden;
            transition: opacity 0.4s ease, visibility 0.4s ease;
            z-index: 1000;
        }

        .modal-overlay.active {
            opacity: 1;
            visibility: visible;
        }

        .modal-window {
            position: relative;
            width: 90%;
            max-width: 500px;
            background: rgba(7, 27, 49, 0.85);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.25);
            border-radius: 20px;
            padding: 30px;
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.6);
            
            transform: scale(0.8) translateY(20px);
            transition: transform 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }

        .modal-overlay.active .modal-window {
            transform: scale(1) translateY(0);
        }

        .close-btn {
            position: absolute;
            top: 15px;
            right: 20px;
            background: none;
            border: none;
            color: rgba(255, 255, 255, 0.6);
            font-size: 28px;
            cursor: pointer;
            line-height: 1;
            transition: color 0.2s ease, transform 0.2s ease;
        }

        .close-btn:hover {
            color: #fff;
            transform: scale(1.2) rotate(90deg);
        }

        .modal-header {
            font-size: 1.8rem;
            margin-bottom: 20px;
            text-align: center;
            border-bottom: 1px solid rgba(255, 255, 255, 0.15);
            padding-bottom: 10px;
        }

        .modal-body {
            font-size: 1rem;
            line-height: 1.6;
            color: #ddd;
            max-height: 60vh;
            overflow-y: auto;
        }

        .socials-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(120px, 1fr));
            gap: 15px;
            padding-top: 10px;
        }

        .social-card {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 15px;
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 12px;
            text-decoration: none;
            color: white;
            opacity: 0.7;
            transition: all 0.3s ease;
        }

        .social-card i, .social-card img {
            font-size: 2rem;
            margin-bottom: 8px;
        }

        .social-card span {
            font-size: 0.85rem;
            letter-spacing: 0.5px;
        }

        .social-card:hover {
            opacity: 1;
            background: rgba(41, 117, 199, 0.3);
            border-color: rgba(41, 117, 199, 0.5);
            transform: translateY(-4px);
            box-shadow: 0 8px 20px rgba(0, 0, 0, 0.4);
        }
    </style>
</head>
<body>

            socials: {

                content : `

        const overlay = document.getElementById('modalOverlay');
        const titleEl = document.getElementById('modalTitle');
        const bodyEl = document.getElementById('modalBody');

        function openModal(key) {
            if (modalData[key]) {
                titleEl.textContent = modalData[key].title;
                bodyEl.innerHTML = modalData[key].content;
                overlay.classList.add('active');
            }
        }

        function closeModal() {
            overlay.classList.remove('active');
        }

        function closeModalOnOverlay(e) {
            if (e.target === overlay) {
                closeModal();
            }
        }

        document.addEventListener('keydown', (e) => {
            if (e.key === 'Escape') {
                closeModal();
            }
        });
    </script>

</html>
